[osm]
countries = ["switzerland", "france", "germany", "italy", "liechtenstein", "austria", "eurostar"]

[gtfs.switzerland]
provider = "opentransportdata_ckan"
publisher = "opentransportdata.swiss"
dataset_search_query = "GTFS2020"
output_filename = "switzerland.gtfs.zip"

[gtfs.france]
provider = "static_url"
url = "https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip"
output_filename = "france.gtfs.zip"

[gtfs.germany]
provider = "static_url"
url = "https://download.gtfs.de/germany/free/latest.zip"
output_filename = "germany.gtfs.zip"

[gtfs.italy]
provider = "static_url"
url = "https://proxy.busone.app/trenitalia/gtfs.zip"
output_filename = "italy.gtfs.zip"

[gtfs.austria]
provider = "static_url"
url = "https://static.web.oebb.at/open-data/soll-fahrplan-gtfs/GTFS_Fahrplan_2026.zip"
output_filename = "austria.gtfs.zip"

 [gtfs.eurostar]
 provider = "static_url"
 url = "https://integration-storage.dm.eurostar.com/gtfs-prod/gtfs_static_commercial_v2.zip"
 output_filename = "eurostar.gtfs.zip"