[project]
name = "graphmill"
version = "0.3.0"
description = "Download and preprocess OSM and GTFS data of Western Europe for routing machines like OTP. "
readme = "README.md"
authors = [
    { name = "karlex27", email = "126259759+karlex27@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dataclasses>=0.8",
    "datetime>=6.0",
    "geopy>=2.5.0",
    "gtfsmith",
    "httpx>=0.28.1",
    "osmium>=4.3.1",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
    "transitforge",
    "typer>=0.27.2",
    "typing>=3.10.0.0",
]

[project.scripts]
graphmill = "graphmill.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
transitforge = { git = "https://github.com/EPFL-LASUR/TransitForge", rev = "v0.2.0" }
gtfsmith = { git = "https://github.com/EPFL-LASUR/GTFSmith", rev = "v0.3.0" }
