[project]
name = "otpmill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karlex27", email = "126259759+karlex27@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dataclasses>=0.8",
    "datetime>=6.0",
    "gtfsmith",
    "httpx>=0.28.1",
    "osmium>=4.3.1",
    "pathlib>=1.0.1",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
    "typing>=3.10.0.0",
]

[project.scripts]
otpmill = "otpmill.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
gtfsmith = { git = "https://github.com/EPFL-LASUR/GTFSmith.git", tag="v0.2.2" }
